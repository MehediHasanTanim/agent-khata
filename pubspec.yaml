name: agentkhata
description: "Cash book for MFS agents and flexiload retailers in Bangladesh."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  cryptography: ^2.9.0
  intl: ^0.20.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.1
  file_picker: ^13.1.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  printing: ^5.15.1
  google_mobile_ads: ^9.1.0
  lucide_icons_flutter: ^3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  generate: true
  uses-material-design: true
  # `flutter run` / the IDE play button without --flavor builds the dev flavor.
  default-flavor: dev
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

# Use SQLCipher builds of SQLite (S0-03). Switch `source` to `sqlite3` to fall
# back to an unencrypted DB if the S0-04 feasibility check fails.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
